name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        # -g overrides org.gradle.user.home=D:/.gradle from gradle.properties (Windows-only path)
        run: sh ./gradlew build --console=plain -g "$HOME/.gradle"

      - name: Prepare artifacts
        run: rm -f build/libs/*-sources.jar

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/voidmaw-*.jar
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gitee release mirroring cannot run here: Gitee blocks cloud-datacenter IPs
      # (curl exits 28 after a 5-minute connect timeout on hosted runners).
      # Run `bash tools/release-gitee.sh <tag>` locally instead; token lives in .gitee-token.
