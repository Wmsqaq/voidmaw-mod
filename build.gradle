plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE')
}

tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses, configureLaunch, generateRemapClasspath
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotServer'
    workingDir = layout.buildDirectory.dir('regression-run').get().asFile
    jvmArgs '-ea', '-Dvoidmaw.regression=true', '-Dfabric.development=true',
            '-Dfabric.defaultModDistributionNamespace=intermediary',
            "-Dfabric.remapClasspathFile=${projectDir}/.gradle/loom-cache/remapClasspath.txt"
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn regressionTest }
// Regression mains run under Knot so Minecraft access transformations are applied.
tasks.named('test') { failOnNoDiscoveredTests = false }
